services:
  app:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "4000:4000"
      - "5173:5173"
    command: sh -c "npm install && npm run dev"
    environment:
      PORT: 4000
      DATABASE_PATH: ./data/enterprise.db

volumes:
  node_modules:
